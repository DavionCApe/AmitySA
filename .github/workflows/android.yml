name: AmitySA Android APK

on:
  push:
    branches: [main, design/neon-glass-ui]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract the Android project from the uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          archive="amitysa-stage8-play-ready%20(1).zip"
          test -f "$archive"
          mkdir -p _amitysa_source
          unzip -q "$archive" -d _amitysa_source
          test -d _amitysa_source/amitysa
          rsync -a --exclude='.git' --exclude='scripts/' _amitysa_source/amitysa/ ./

      - name: Install uploaded AmitySA home logo
        shell: bash
        run: |
          set -euo pipefail
          source_logo="assets/amitysa_home_logo.jpg"
          test -s "$source_logo"
          mkdir -p app/src/main/res/drawable-nodpi
          # Remove every old variant so Android cannot select a stale drawable from
          # drawable/, drawable-hdpi/, mipmap/ or another qualified resource folder.
          find app/src/main/res -type f \( -name 'amity_logo.png' -o -name 'amity_logo.jpg' -o -name 'amity_logo.webp' -o -name 'amity_logo.xml' \) -delete
          mkdir -p app/src/main/res/drawable-nodpi
          cp "$source_logo" app/src/main/res/drawable-nodpi/amity_logo.jpg

      - name: Generate Android launcher icons from the exact home artwork
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 scripts/apply_amitysa_artwork_launcher_icon.py
          test -s app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          grep -R -q 'android:icon="@mipmap/ic_launcher"' app/src


      - name: Apply Kotlin compile fixes
        run: python3 scripts/apply_build_fixes.py

      - name: Apply visual and scrolling upgrades
        run: python3 scripts/apply_ui_upgrade.py

      - name: Insert South African emergency services page
        run: python3 scripts/apply_emergency_directory.py

      - name: Verify dropdown callback survives UI generation
        shell: bash
        run: |
          set -euo pipefail
          file=app/src/main/java/com/amitysa/app/MainActivity.kt
          grep -Fq 'onMenuAction: (String) -> Unit' "$file"
          grep -Fq 'Header(account.username, onOpenThemes) { item ->' "$file"
          grep -Fq 'WelcomeScreen(account.username) { showEmergency = true }' "$file"

      - name: Apply consistent app-wide light and dark themes
        run: python3 scripts/apply_theme_consistency.py

      - name: Keep preview shortcut on signup/sign-in screen only
        run: python3 scripts/apply_auth_preview_scope.py

      - name: Add optional encrypted remember-login feature
        run: python3 scripts/apply_remember_login.py

      - name: Apply approved AmitySA neon glass visual design
        run: python3 scripts/apply_neon_glass_design.py

      - name: Apply AmitySA Fantasy UI and Sci-Fi HUD design
        run: python3 scripts/apply_fui_hud.py

      - name: Add previous-page navigation, random parent/teacher links and terms/privacy page
        run: python3 scripts/apply_navigation_links_legal.py

      - name: Add Android 8+ Bluetooth and Wi-Fi compatibility
        run: python3 scripts/apply_device_connectivity.py

      - name: Add parent-child phone and Bluetooth accessory support
        run: python3 scripts/apply_nearby_bluetooth.py

      - name: Add in-app Bluetooth and Wi-Fi connection screen
        run: python3 scripts/apply_connectivity_screen.py

      - name: Apply the replacement logo after all home-screen design changes
        run: python3 scripts/apply_floating_logo.py

      - name: Apply advanced JARVIS holographic navigation
        run: python3 scripts/apply_jarvis_advanced_navigation.py

      - name: Verify the final home-screen logo and resource
        shell: bash
        run: |
          set -euo pipefail
          kotlin_file=app/src/main/java/com/amitysa/app/MainActivity.kt
          logo_file=app/src/main/res/drawable-nodpi/amity_logo.jpg
          test -s "$logo_file"
          grep -Fq 'private fun FloatingAmityLogo' "$kotlin_file"
          grep -Fq 'painter = painterResource(R.drawable.amity_logo)' "$kotlin_file"
          grep -Fq 'FloatingAmityLogo(' "$kotlin_file"
          grep -Fq 'contentScale = ContentScale.Crop' "$kotlin_file"
          grep -Fq 'modifier = Modifier.fillMaxSize().alpha(0.24f)' "$kotlin_file"
          if grep -A45 -F 'private fun Header(' "$kotlin_file" | grep -Fq 'Image('; then
            echo "Header still contains a direct Image call; logo replacement failed."
            exit 1
          fi
          echo "Verified: final home-screen Header uses the replacement floating AmitySA logo."

      - name: Print Kotlin compile context for targeted repairs
        run: python3 scripts/print_compile_context.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test optional backend
        run: node server/smoke-test.js

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already include the Android SDK.
      # Avoid setup-android's deprecated "tools" package installation.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Make Gradle launcher executable
        run: chmod +x gradlew

      - name: Build installable debug APKs
        run: ./gradlew assembleDirectDebug assemblePlayDebug --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AmitySA-Android-APKs
          path: |
            app/build/outputs/apk/direct/debug/*.apk
            app/build/outputs/apk/play/debug/*.apk
          if-no-files-found: error
          retention-days: 30
