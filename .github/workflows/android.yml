name: AmitySA Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Keep the newest workspace build; cancel stale builds after rapid commits.
concurrency:
  group: amitysa-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract the Android project from the uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          archive="amitysa-stage8-play-ready%20(1).zip"
          test -f "$archive"
          mkdir -p _amitysa_source
          unzip -q "$archive" -d _amitysa_source
          test -d _amitysa_source/amitysa
          rsync -a --exclude='.git' --exclude='scripts/' _amitysa_source/amitysa/ ./

      - name: Install image processing dependency
        run: python3 -m pip install --quiet Pillow

      - name: Replace old launcher icon with new AmitySA artwork
        run: python3 scripts/apply_launcher_icon.py

      - name: Apply Kotlin compile fixes
        run: python3 scripts/apply_build_fixes.py

      - name: Apply visual and scrolling upgrades
        run: python3 scripts/apply_ui_upgrade.py

      - name: Insert South African emergency services page
        run: python3 scripts/apply_emergency_directory.py

      - name: Verify dropdown callback survives UI generation
        shell: bash
        run: |
          set -euo pipefail
          file=app/src/main/java/com/amitysa/app/MainActivity.kt
          grep -Fq 'onMenuAction: (String) -> Unit' "$file"
          grep -Fq 'Header(account.username, onOpenThemes) { item ->' "$file"
          grep -Fq 'WelcomeScreen(account.username) { showEmergency = true }' "$file"

      - name: Replace legacy styling with the JARVIS Command Centre theme across the full app
        run: python3 scripts/apply_theme_consistency.py

      - name: Apply AmitySA FUI and sci-fi HUD styling across all screens
        run: python3 scripts/apply_fui_hud.py


      - name: Add animated JARVIS command-centre HUD across all app pages
        run: python3 scripts/apply_jarvis_motion.py
      - name: Style app navigation with JARVIS holographic command dock
        run: python3 scripts/apply_jarvis_navigation.py

      - name: Redesign the AmitySA home dashboard as a JARVIS command centre
        run: python3 scripts/apply_dashboard_redesign.py
      - name: Fetch pinned Three.js runtime for offline HUD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/vendor
          curl --fail --location --retry 3 --retry-delay 2 \
            https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js \
            --output web/vendor/three.min.js
          test "$(wc -c < web/vendor/three.min.js)" -gt 10000
      - name: Embed the JARVIS Multi-AI web HUD inside the native Android dashboard
        run: python3 scripts/apply_jarvis_web_embed.py
      - name: Harden JARVIS file transfer and package offline HUD assets
        run: python3 scripts/apply_jarvis_transfer_hardening.py

      - name: Keep preview shortcut on signup/sign-in screen only
        run: python3 scripts/apply_auth_preview_scope.py

      - name: Add optional encrypted remember-login feature
        run: python3 scripts/apply_remember_login.py

      - name: Apply previous-page navigation history and back behavior
        run: python3 scripts/apply_navigation_history.py

      - name: Verify previous-page navigation is installed
        shell: bash
        run: |
          set -euo pipefail
          file=app/src/main/java/com/amitysa/app/MainActivity.kt
          grep -Fq 'val screenHistory = remember { mutableStateListOf<String>() }' "$file"
          grep -Fq 'fun navigateBack()' "$file"
          grep -Fq 'BackHandler(enabled = acc != null && screen != "home") { navigateBack() }' "$file"

      - name: Print Kotlin compile context for targeted repairs
        run: python3 scripts/print_compile_context.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify offline JARVIS assets and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/three.min.js
          grep -Fq 'src="three.min.js"' app/src/main/assets/jarvis-earth-hud.html
          grep -Fq 'window.jarvisFileResultChunk' app/src/main/assets/jarvis-earth-hud.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          page = Path("app/src/main/assets/jarvis-earth-hud.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", page, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline HUD script, found {len(scripts)}")
          Path("/tmp/jarvis-earth-hud.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/jarvis-earth-hud.js
          grep -Fq 'ThreadPoolExecutor' app/src/main/java/com/amitysa/app/MainActivity.kt
          grep -Fq 'FILE_READ_TIMEOUT' app/src/main/java/com/amitysa/app/MainActivity.kt

      - name: Test optional backend
        run: node server/smoke-test.js

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already include the Android SDK.
      # Avoid setup-android's deprecated "tools" package installation.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Print final generated Kotlin around compiler failure
        shell: bash
        run: |
          set -euo pipefail
          file=app/src/main/java/com/amitysa/app/MainActivity.kt
          echo "===== FINAL MainActivity.kt lines 1645-1685 ====="
          nl -ba "$file" | sed -n '1645,1685p'
          echo "===== FINAL MainActivity.kt symbol references ====="
          grep -nE '\\b(icon|time)\\b' "$file" | tail -40 || true

      - name: Build installable debug APKs
        run: gradle assembleDirectDebug assemblePlayDebug --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AmitySA-Android-APKs
          path: |
            app/build/outputs/apk/direct/debug/*.apk
            app/build/outputs/apk/play/debug/*.apk
          if-no-files-found: error
          retention-days: 30
