<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#06111d"><title>AmitySA JARVIS Earth Core</title><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<style>
:root{--c:#00e5ff;--a:#ff9100;--bg:#06111d;--glass:rgba(5,20,34,.88)}*{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:#e5fbff;font-family:Arial,sans-serif}#app{position:relative;background:radial-gradient(ellipse at 50% 48%,#0b3651,#061522 62%,#030912)}#app:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(#00e5ff22 1px,transparent 1px),linear-gradient(90deg,#00e5ff22 1px,transparent 1px);background-size:32px 32px}

.stage{position:absolute;inset:85px 0 78px;display:grid;place-items:center;overflow:hidden}.globe{position:relative;width:min(90vw,520px);height:min(90vw,520px);max-height:100%;aspect-ratio:1;display:grid;place-items:center}#earth{position:absolute;inset:0;width:100%;height:100%;touch-action:none;filter:drop-shadow(0 0 28px #00bfff55)}.orbit{position:absolute;inset:5%;border:1px solid #00e5ff55;border-radius:50%;transform:rotateX(67deg) rotateZ(-20deg);pointer-events:none}.orbit.amber{inset:12%;transform:rotateY(68deg) rotateZ(25deg);border-color:#ff910066}.orbit.dash{inset:0;border-style:dashed;border-color:#00e5ff35;animation:orbit 38s linear infinite}
#menu{position:absolute;z-index:3;width:88px;height:88px;border-radius:50%;border:1px solid #b5fbff;background:radial-gradient(circle at 35% 28%,#1a708a,#061b2e 72%);box-shadow:0 0 0 7px #00e5ff15,0 0 28px #00e5ff88,inset 0 0 18px #00e5ff55;cursor:pointer;font-size:11px;font-weight:bold;letter-spacing:1px}#menu small{display:block;margin-top:5px;font-size:7px;color:#a9f4fa}
.node{position:absolute;z-index:4;width:62px;height:62px;border:1px solid #00e5ff99;border-radius:50%;background:linear-gradient(145deg,#104058f2,#061827f2);box-shadow:0 0 16px #00e5ff35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;opacity:0;transform:scale(.35);pointer-events:none;transition:.3s;cursor:pointer}.node b{font-size:17px}.node span{font-size:7px;letter-spacing:.4px;white-space:nowrap}.open .node{opacity:1;transform:scale(1);pointer-events:auto}.node:active,.node:hover{border-color:var(--a);box-shadow:0 0 20px #ff910077}.family{top:15%;left:12%}.zones{top:15%;right:12%}.map{top:48%;right:0}.contacts{bottom:16%;right:12%}.activity{bottom:16%;left:12%}.settings{top:48%;left:0}
.caption{position:absolute;bottom:4%;text-align:center;pointer-events:none}.caption b{font-size:9px;letter-spacing:2px}.caption small{display:block;margin-top:5px;color:#7d9bab;font-size:7px;letter-spacing:1px}
.drawer{position:absolute;z-index:7;left:9px;right:9px;bottom:75px;max-height:45%;padding:15px;border:1px solid #00e5ff77;border-radius:16px;background:rgba(3,17,29,.96);backdrop-filter:blur(16px);box-shadow:0 0 24px #00e5ff25;transform:translateY(120%);transition:transform .32s;overflow:auto}.drawer.show{transform:translateY(0)}.drawerTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.drawer strong{font-size:10px;letter-spacing:1.6px;color:var(--c)}.drawer p{font-size:12px;line-height:1.5;color:#bad0da;margin:0}.close{border:1px solid #ff910088;background:#ff910015;color:var(--a);border-radius:8px;padding:6px 10px}

.telemetry{position:absolute;bottom:70px;left:13px;color:#80a6b5;font:7px/1.7 monospace;pointer-events:none}.telemetry.r{left:auto;right:13px;text-align:right}#toast{position:absolute;z-index:9;top:90px;left:50%;transform:translate(-50%,-8px);opacity:0;padding:8px 12px;background:#071d2d;border:1px solid #00e5ff66;border-radius:8px;color:#b9faff;font-size:9px;transition:.2s;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes orbit{to{transform:rotate(360deg)}}@media(max-height:620px){.globe{width:min(77vw,390px);height:min(77vw,390px)}#menu{width:74px;height:74px}.node{width:53px;height:53px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><div id="app">
<svg class="shield" viewBox="0 0 400 460" aria-hidden="true"><path d="M200 18 350 75v118c0 105-63 190-150 245C113 383 50 298 50 193V75z" fill="#00e5ff" fill-opacity=".035" stroke="#00e5ff" stroke-width="5"/><circle cx="200" cy="174" r="46" fill="none" stroke="#00e5ff" stroke-width="4"/><path d="M200 132v84m-42-42h84M125 260q75-65 150 0" fill="none" stroke="#00e5ff" stroke-width="4"/><circle cx="145" cy="258" r="9" fill="none" stroke="#ff9100" stroke-width="4"/><circle cx="255" cy="258" r="9" fill="none" stroke="#ff9100" stroke-width="4"/></svg>
<header><div class="brandIcon">✧</div><div class="brand"><b>JARVIS AI CHATBOT</b><small>AMITYSA FAMILY SAFETY NETWORK</small></div><canvas id="wave" width="156" height="60"></canvas><div class="live">LIVE</div></header>
<main class="stage"><div class="globe" id="globe"><canvas id="earth"></canvas><div class="orbit"></div><div class="orbit amber"></div><div class="orbit dash"></div><button id="menu">MENU<small>ACTIVATE</small></button>
<button class="node family" data-feature="Family"><b>⌂</b><span>FAMILY</span></button><button class="node zones" data-feature="Safe Zones"><b>◎</b><span>SAFE ZONES</span></button><button class="node map" data-feature="Live Map"><b>⌖</b><span>LIVE MAP</span></button><button class="node contacts" data-feature="Emergency Contacts"><b>✆</b><span>CONTACTS</span></button><button class="node activity" data-feature="Activity"><b>◷</b><span>ACTIVITY</span></button><button class="node settings" data-feature="Settings"><b>⚙</b><span>SETTINGS</span></button><div class="caption"><b>AMITYSA // EARTH CORE</b><small>TOUCH + DRAG TO ROTATE · AUTO ROTATION STOPS ON TOUCH</small></div></div></main>
<div class="telemetry">CORE: <span id="coreState">AUTO ROTATION</span><br>GRID: ACTIVE</div><div class="telemetry r">VECTOR: <span id="delta">0 / 0</span><br>UPLINK: NATIVE BRIDGE</div>
<section class="drawer" id="drawer"><div class="drawerTop"><strong id="drawerTitle">FEATURE MODULE</strong><button class="close" id="close">CLOSE ✕</button></div><p id="drawerText">Select a module.</p></section>
<footer><button class="emergency" id="emergency"><span class="sos">SOS</span>EMERGENCY SERVICES</button><span class="footnote">24/7<br>RESPONSE</span></footer><div id="toast"></div></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),canvas=$('#earth'),globe=$('#globe');let auto=true,drag=false,lx=0,ly=0,rx=-.18,ry=.3,vx=0,vy=0,opened=false;
function toast(s){const e=$('#toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function drawer(title,body){$('#drawerTitle').textContent=title.toUpperCase();$('#drawerText').textContent=body;$('#drawer').classList.add('show')}
$('#close').onclick=()=>$('#drawer').classList.remove('show');
$('#menu').onclick=()=>{opened=!opened;globe.classList.toggle('open',opened);toast(opened?'RADIAL FEATURES DEPLOYED':'RADIAL FEATURES RETRACTED')};
const labels=['Family','Safe Zones','Live Map','Emergency Contacts','Activity','Settings'];const desc={'Family':'Launch the AmitySA family management feature.','Safe Zones':'Launch the AmitySA safe-zone management feature.','Live Map':'Launch the AmitySA location and map feature.','Emergency Contacts':'Launch the AmitySA emergency contacts feature.','Activity':'Launch the AmitySA activity and alerts feature.','Settings':'Launch the AmitySA settings feature.'};
document.querySelectorAll('[data-feature]').forEach(b=>b.onclick=()=>{let n=b.dataset.feature;drawer(n,desc[n]);try{window.AmityNative?.onFeatureSelected?.(n)}catch(e){toast('Native route bridge unavailable')}});
$('#emergency').onclick=()=>{drawer('Emergency Services','Opening the AmitySA emergency response directory.');try{window.AmityNative?.onEmergencyRequested?.()}catch(e){toast('Emergency bridge unavailable')}};
const texture=document.createElement('canvas');texture.width=1024;texture.height=512;const tx=texture.getContext('2d');const grad=tx.createLinearGradient(0,0,0,512);grad.addColorStop(0,'#082e49');grad.addColorStop(.5,'#08778b');grad.addColorStop(1,'#041b33');tx.fillStyle=grad;tx.fillRect(0,0,1024,512);tx.strokeStyle='#00e5ff42';for(let x=0;x<1024;x+=32){tx.beginPath();tx.moveTo(x,0);tx.lineTo(x,512);tx.stroke()}for(let y=0;y<512;y+=32){tx.beginPath();tx.moveTo(0,y);tx.lineTo(1024,y);tx.stroke()}
tx.fillStyle='#168f91';tx.strokeStyle='#62f4e3';tx.lineWidth=3;const land=[[[80,100],[140,65],[205,78],[235,130],[205,175],[180,230],[145,265],[115,220]],[[230,270],[280,290],[295,350],[265,420],[235,470],[210,400]],[[430,95],[485,65],[550,82],[575,125],[540,160],[500,145],[465,180]],[[470,190],[530,185],[560,240],[535,310],[500,380],[470,320]],[[610,90],[690,65],[780,80],[850,125],[830,185],[760,205],[710,175],[660,200]],[[780,300],[840,285],[880,325],[860,365],[810,355]]];land.forEach(poly=>{tx.beginPath();poly.forEach((p,i)=>i?tx.lineTo(...p):tx.moveTo(...p));tx.closePath();tx.fill();tx.stroke()});
if(window.THREE){const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,1,.1,100);camera.position.z=4.4;const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));const group=new THREE.Group();scene.add(group);const map=new THREE.CanvasTexture(texture);map.colorSpace=THREE.SRGBColorSpace;group.add(new THREE.Mesh(new THREE.SphereGeometry(1.34,96,64),new THREE.MeshPhongMaterial({map,emissive:0x062b42,emissiveIntensity:.35,shininess:30})));group.add(new THREE.Mesh(new THREE.SphereGeometry(1.355,36,24),new THREE.MeshBasicMaterial({color:0x00e5ff,wireframe:true,transparent:true,opacity:.16})));group.add(new THREE.Mesh(new THREE.SphereGeometry(1.43,64,48),new THREE.MeshBasicMaterial({color:0x00bfff,transparent:true,opacity:.09,side:THREE.BackSide})));const ring=new THREE.Mesh(new THREE.TorusGeometry(1.62,.009,8,180),new THREE.MeshBasicMaterial({color:0x00e5ff,transparent:true,opacity:.65}));ring.rotation.x=1.2;group.add(ring);scene.add(new THREE.AmbientLight(0x8adfff,1.1));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(3,2,4);scene.add(light);function render(){requestAnimationFrame(render);let w=canvas.clientWidth,h=canvas.clientHeight;if(w&&h){camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}if(auto&&!drag)ry+=.0018;else if(!drag){rx+=vy;ry+=vx;vx*=.94;vy*=.94}group.rotation.x=rx;group.rotation.y=ry;ring.rotation.z+=.001;renderer.render(scene,camera)}render();}else{toast('3D renderer unavailable')}
function down(e){drag=true;auto=false;vx=vy=0;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture?.(e.pointerId);$('#coreState').textContent='MANUAL CONTROL'}function move(e){if(!drag)return;let dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;ry+=dx*.008;rx+=dy*.008;vx=dx*.0005;vy=dy*.0005;$('#delta').textContent=dx.toFixed(0)+' / '+dy.toFixed(0)}function up(){if(drag){drag=false;$('#coreState').textContent='MANUAL / INERTIA'}}canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);canvas.addEventListener('lostpointercapture',up);
const wave=$('#wave'),wctx=wave.getContext('2d');let phase=0;function draw(){wctx.clearRect(0,0,wave.width,wave.height);wctx.strokeStyle='#00e5ff';wctx.lineWidth=2;wctx.shadowBlur=9;wctx.shadowColor='#00e5ff';wctx.beginPath();for(let x=0;x<wave.width;x++){let y=30+Math.sin(x*.1+phase)*Math.sin(x*.02+phase*.4)*12+Math.sin(x*.23-phase)*3;x?wctx.lineTo(x,y):wctx.moveTo(x,y)}wctx.stroke();wctx.shadowBlur=0;phase+=.08;requestAnimationFrame(draw)}draw();window.addEventListener('keydown',e=>{if(e.key==='Escape')$('#drawer').classList.remove('show')});
})();
</script></body></html>
